server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain application/xml;

  # Prerendered pages are cloud.html, developers.html, …; serve them at /cloud, /developers.
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Hashed build output never changes.
  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}
